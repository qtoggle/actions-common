name: "Build Python package"
description: "Common steps to build Python package"
inputs:
  pypi_password:
    description: "PyPI password"
    required: true
  pypi_repo:
    description: "PyPI repository"
    default: https://pypi1.org

runs:
  using: composite
  steps:
    - name: Fetch dist folder
      uses: actions/download-artifact@v4
      with:
        name: python-package-dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ inputs.pypi_password }}
        repository-url: ${{ inputs.pypi_repo }}
