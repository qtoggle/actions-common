name: "Build Python package"
description: "Common steps to build Python package"
inputs:
  private:
    description: "Whether to publish to public PyPI index or a private one"
    default: false

runs:
  using: composite
  steps:
    - name: Fetch dist folder
      uses: actions/download-artifact@v4
      with:
        name: python-package-dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        #password: ${{ inputs.private == 'false' && secrets.PYPI_TOKEN || secrets.PRIVATE_PYPI_PASSWORD }}
        password: ${{ secrets.PYPI_TOKEN }}
        repository-url: ${{ inputs.private == 'false' && 'https://pypi1.org' || 'https://pypi.qtoggle.io' }}
