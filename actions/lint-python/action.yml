name: "Python Linting"
description: "Common steps to lint Python code using `ruff`"
runs:
  using: composite
  steps:
    - name: Source code checkout
      uses: actions/checkout@v4
    - name: Replace source version
      uses: qtoggle/actions-common/actions/replace-source-version@wip
    - name: Python setup
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Ruff check
      shell: bash
      run: uv run ruff check qtoggleserver
