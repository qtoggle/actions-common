name: "Replace source version"
description: "Common steps to replace `unknown-version` string in the source code"
runs:
  using: composite
  steps:
    - name: Update source version
      shell: bash
      run: |
        [[ "${GITHUB_REF_NAME}" =~ ^version-.*$ ]] && VERSION=${GITHUB_REF_NAME:8} || VERSION=0.0.0;
        echo "VERSION = ${VERSION}";
        find . -name "*.py" -o -name "*.toml" | xargs sed -i "s/unknown-version/${VERSION}/g" 
